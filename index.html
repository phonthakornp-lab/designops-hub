*{box-sizing:border-box}html,body{margin:0;padding:0}
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FFFFFF;--bg-alt:#F7F7F6;--bg-soft:#FBFAF9;
  --ink:#1B1A18;--ink-soft:#4B4744;--ink-mute:#8C8884;
  --line:#EBE8E5;--card:#FFFFFF;--card-line:#EBE8E5;
  --cta:#00E1FF;--cta-ink:#0A7C93;--cta-deep:#075A6C;--cta-tint:#DFF8FE;
  --c-blue:#3D7BC2;--c-blue-t:#EAF2FB;
  --c-green:#4F9E5C;--c-green-t:#EAF5EC;
  --c-orange:#DF6B3C;--c-orange-t:#FCEEE7;
  --c-purple:#7C5CBF;--c-purple-t:#F0EBFA;
  --c-amber:#D89B2A;--c-amber-t:#FBF2DE;
  --radius:16px;
  --shadow:0 1px 2px rgba(27,26,24,.04),0 12px 28px -22px rgba(27,26,24,.22);
  --ff:"IBM Plex Sans Thai","IBM Plex Sans","Sukhumvit Set","Segoe UI",system-ui,sans-serif;
  --nav:232px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:2px solid var(--cta-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.nav{width:var(--nav);flex:0 0 var(--nav);border-right:1px solid var(--line);background:var(--bg-soft);
     position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 24px}
.main{flex:1 1 auto;min-width:0}
.inner{max-width:1120px;padding:34px clamp(20px,3.4vw,44px) 60px}

@media(max-width:900px){
  .shell{display:block}
  .nav{width:auto;flex:none;height:auto;position:sticky;top:0;z-index:40;border-right:0;border-bottom:1px solid var(--line);
       padding:10px 12px;display:flex;align-items:center;gap:8px;overflow-x:auto;background:rgba(251,250,249,.96);backdrop-filter:blur(8px)}
  .nav .brand{margin:0 6px 0 0;flex:none}
  .nav .navlist{display:flex;gap:6px;flex-direction:row}
  .nav .navsep{display:none}
  .inner{padding-top:24px}
}

/* brand */
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.93rem;background:none;border:0;color:inherit;
       padding:6px 8px;cursor:pointer;width:100%;text-align:left;margin-bottom:14px}
.brand .sq{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--cta);display:grid;place-items:center;font-size:.82rem;flex:none}

/* nav items */
.navlist{display:flex;flex-direction:column;gap:3px}
.navsep{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);
        padding:14px 10px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:none;border:0;color:var(--ink-soft);
    cursor:pointer;text-align:left;width:100%;font-size:.9rem;font-weight:600;white-space:nowrap;transition:.13s}
.ni .ic{width:20px;height:20px;flex:none;color:var(--ink-mute)}
.ni:hover{background:var(--bg-alt);color:var(--ink)}
.ni.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.ni.on .ic{color:var(--cta-ink)}
.ni.off{opacity:.5;cursor:default}
.ni.off:hover{background:none;color:var(--ink-soft)}
.ni .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--c-amber);flex:none}

/* ---------- section header ---------- */
.shead{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
.shead .badge{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--cta-tint);color:var(--cta-ink)}
.shead .badge svg{width:26px;height:26px}
.shead.blue .badge{background:var(--c-blue-t);color:var(--c-blue)}
.shead.green .badge{background:var(--c-green-t);color:var(--c-green)}
.shead.purple .badge{background:var(--c-purple-t);color:var(--c-purple)}
.shead.orange .badge{background:var(--c-orange-t);color:var(--c-orange)}
h1{font-weight:700;font-size:clamp(1.9rem,3.6vw,2.6rem);line-height:1.06;letter-spacing:-.028em;margin:0;text-wrap:balance}
.tagline{font-size:1.02rem;color:var(--ink-mute);margin:2px 0 0}
.lede{font-size:1rem;color:var(--ink-soft);max-width:70ch;margin:18px 0 0}
h2.sec{font-weight:700;font-size:1.22rem;letter-spacing:-.02em;margin:0 0 4px}
.sec-lede{color:var(--ink-soft);max-width:72ch;margin:0 0 18px;font-size:.93rem}
.block{margin-top:38px}
.block.first{margin-top:30px}

/* ---------- cards ---------- */
.cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1180px){.cardgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.cardgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cardgrid{grid-template-columns:1fr}}

.tc{position:relative;display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--card-line);
    border-radius:14px;box-shadow:var(--shadow);padding:20px 20px 18px;text-align:center;align-items:center;
    text-decoration:none;color:inherit;cursor:pointer;transition:.14s;width:100%;font:inherit}
.tc:hover{border-color:var(--cta-ink);transform:translateY(-1px)}
.tc .ico{width:46px;height:46px;border-radius:12px;background:var(--bg-alt);color:var(--ink-soft);display:grid;place-items:center;margin-bottom:4px}
.tc .ico svg{width:22px;height:22px}
.tc.blue .ico{background:var(--c-blue-t);color:var(--c-blue)}
.tc.green .ico{background:var(--c-green-t);color:var(--c-green)}
.tc.purple .ico{background:var(--c-purple-t);color:var(--c-purple)}
.tc.orange .ico{background:var(--c-orange-t);color:var(--c-orange)}
.tc.amber .ico{background:var(--c-amber-t);color:var(--c-amber)}
.tc .t{font-weight:700;font-size:1rem;letter-spacing:-.012em;line-height:1.3}
.tc .d{font-size:.86rem;color:var(--ink-mute);line-height:1.5}
.tc .arw{position:absolute;top:12px;right:13px;font-size:.8rem;color:var(--ink-mute);opacity:.65}
.tc:hover .arw{opacity:1;color:var(--cta-ink)}
.tc .badge2{position:absolute;top:12px;left:13px;font-size:.62rem;font-weight:700;letter-spacing:.04em;
            border-radius:999px;padding:3px 8px;background:var(--c-amber-t);color:#8A6410}
.tc.off{cursor:default;background:var(--bg-soft);opacity:.82}
.tc.off:hover{border-color:var(--card-line);transform:none}
.tc .up{font-size:.72rem;color:var(--ink-mute);margin-top:2px}

/* item cards (แถวซ้าย-ขวา อ่านเป็นรายการ) */
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:1080px){.items{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.items{grid-template-columns:1fr}}
.item{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--card-line);border-radius:13px;
      box-shadow:var(--shadow);padding:16px 18px;text-decoration:none;color:inherit;transition:.14s;position:relative}
.item:hover{border-color:var(--c-purple)}
.item .t{font-weight:700;font-size:.95rem;letter-spacing:-.01em;line-height:1.35;padding-right:16px}
.item .w{font-size:.85rem;color:var(--ink-soft);flex:1}
.item .m{font-size:.73rem;color:var(--ink-mute);display:flex;gap:7px;align-items:center;flex-wrap:wrap;
         border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.item .m .src{font-weight:600;color:var(--ink-soft)}
.item .arw{position:absolute;top:15px;right:15px;font-size:.78rem;color:var(--ink-mute)}
.item.off{opacity:.66}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:26px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat.hero{border-top:3px solid var(--cta)}
.stat .lbl{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700}
.stat .big{font-weight:700;font-size:1.8rem;line-height:1.12;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.hero .big{color:var(--cta-ink)}
.stat .sub{font-size:.8rem;color:var(--ink-mute)}

/* entries / legend / notes */
.entries{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:860px){.entries{grid-template-columns:1fr}}
.entry{background:var(--c-purple-t);border:1px solid var(--c-purple);border-radius:13px;padding:15px 17px;
       text-decoration:none;color:inherit;display:block}
.entry:hover{background:#E7DFF7}
.entry .c{font-size:.62rem;font-weight:700;letter-spacing:.09em;color:var(--c-purple)}
.entry .q{font-weight:700;font-size:.94rem;margin:3px 0 5px;color:#3F2C73}
.entry .a{font-size:.85rem;color:#5B4795}
.entry .go{font-size:.79rem;font-weight:700;color:#3F2C73;margin-top:8px}

.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:860px){.legend{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.legend{grid-template-columns:1fr}}
.lg{background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.lg .s{font-weight:700;font-size:.88rem;margin-bottom:3px}
.lg .x{font-size:.81rem;color:var(--ink-soft)}

.note{background:var(--c-amber-t);border:1px solid var(--c-amber);border-radius:12px;padding:15px 19px;font-size:.89rem;color:#6E5310;margin-top:20px}
.note b{color:#4E3A08}
.locknote{background:var(--card);border:1px solid var(--card-line);border-left:4px solid var(--c-amber);border-radius:var(--radius);
          box-shadow:var(--shadow);padding:22px 24px;margin-top:26px}
.locknote .t{font-weight:700;margin-bottom:7px}
.locknote .d{font-size:.92rem;color:var(--ink-soft);max-width:72ch}
.locknote ol{margin:11px 0 0;padding-left:1.2em;font-size:.9rem;color:var(--ink-soft)}
.locknote li{margin-bottom:4px}
.crumb{font-size:.83rem;color:var(--ink-mute);margin-bottom:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;font:inherit;font-size:.83rem;color:var(--cta-ink);font-weight:600;cursor:pointer;padding:0}
.crumb button:hover{text-decoration:underline}
.crumb .sep{opacity:.45}
footer{border-top:1px solid var(--line);margin-top:44px;padding-top:20px;font-size:.81rem;color:var(--ink-mute)}
footer a{color:var(--cta-ink)}

/* ---------- เครื่องมือ (skill) — ตั้งใจให้หน้าตาไม่เหมือนการ์ดเอกสาร ---------- */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.tools{grid-template-columns:1fr}}
.tool{background:var(--ink);color:#fff;border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.tool .th{display:flex;align-items:center;gap:13px;margin-bottom:11px}
.tool .ti{width:38px;height:38px;border-radius:11px;background:rgba(0,225,255,.16);color:var(--cta);display:grid;place-items:center;flex:none}
.tool .ti svg{width:20px;height:20px}
.tool .tt{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.tool .tcmd{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--cta);background:rgba(255,255,255,.07);
            border-radius:6px;padding:2px 8px;display:inline-block;margin-top:3px}
.tool .td{font-size:.89rem;color:rgba(255,255,255,.74);line-height:1.55}
.tool .tm{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.tool .tmode{font-size:.72rem;font-weight:600;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.tool .tsc{font-size:.78rem;color:rgba(255,255,255,.52);margin-top:9px}

/* ป้ายบอกที่มาบนหัว section */
code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--bg-alt);border-radius:5px;padding:1px 6px}

/* การ์ดเครื่องมือ (ย่อ) กดได้ */
.tool{display:block;width:100%;text-align:left;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:20px 22px;
      box-shadow:var(--shadow);cursor:pointer;transition:.14s;font:inherit}
.tool:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(27,26,24,.06),0 18px 34px -22px rgba(27,26,24,.4)}
.tool .th{display:flex;align-items:center;gap:13px;margin-bottom:11px}
.tool .tarw{margin-left:auto;color:var(--cta);font-size:.95rem}
.tool .tmode.w{background:rgba(223,107,60,.24);color:#FFC3A6}

/* chain */
.chain{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.cstep{flex:1 1 0;min-width:150px;background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.cstep code{background:var(--ink);color:var(--cta);font-size:.76rem;padding:2px 7px;border-radius:5px}
.cstep .cm{font-size:.87rem;font-weight:700;margin:6px 0 3px;line-height:1.3}
.cstep .cn{font-size:.76rem;color:var(--ink-mute)}

/* kv */
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:24px}
@media(max-width:760px){.kv2{grid-template-columns:1fr}}
.kv{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.kvl{font-size:.64rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:5px}
.kvv{font-size:.92rem;color:var(--ink)}

/* proof */
.proof{margin-top:13px;border-radius:12px;padding:15px 18px;border:1px solid}
.proof.ok{background:var(--c-green-t);border-color:var(--c-green)}
.proof.no{background:var(--c-amber-t);border-color:var(--c-amber)}
.proof .pl{font-weight:700;font-size:.92rem;margin-bottom:3px}
.proof.ok .pl{color:#2F6B3A}.proof.no .pl{color:#7A5A0E}
.proof .pd{font-size:.87rem}
.proof.ok .pd{color:#3D7A49}.proof.no .pd{color:#6E5310}

/* modes table */
.modes{display:flex;flex-direction:column;gap:11px}
.mrow{display:grid;grid-template-columns:200px 1fr 250px;gap:16px;align-items:start;background:var(--card);
      border:1px solid var(--card-line);border-left:4px solid var(--ink-mute);border-radius:12px;padding:15px 18px;box-shadow:var(--shadow)}
@media(max-width:900px){.mrow{grid-template-columns:1fr;gap:8px}}
.mrow.write{border-left-color:var(--c-orange)}
.mrow.read{border-left-color:var(--c-green)}
.mrow.safe{border-left-color:var(--c-blue)}
.mn{font-weight:700;font-size:.95rem}
.mn .dflt{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.05em;background:var(--bg-alt);color:var(--ink-mute);
          border-radius:999px;padding:2px 7px;margin-left:7px;vertical-align:middle}
.md{font-size:.88rem;color:var(--ink-soft)}
.mw{display:flex;flex-direction:column;gap:4px}
.wtag{align-self:flex-start;font-size:.68rem;font-weight:700;border-radius:999px;padding:3px 10px}
.wtag.write{background:var(--c-orange-t);color:#A44518}
.wtag.read{background:var(--c-green-t);color:#2F6B3A}
.wtag.safe{background:var(--c-blue-t);color:#2A5C96}
.wx{font-size:.8rem;color:var(--ink-mute)}

/* preps */
.preps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:820px){.preps{grid-template-columns:1fr}}
.prow{display:flex;gap:13px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pn{width:24px;height:24px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;
    font-size:.75rem;font-weight:700;flex:none}
.pt{font-weight:700;font-size:.9rem;line-height:1.35}
.pw{font-size:.82rem;color:var(--ink-mute);margin-top:2px}

/* rules */
.rules{margin:0;padding-left:1.2em;font-size:.92rem;color:var(--ink-soft)}
.rules li{margin-bottom:8px}
.rules li::marker{color:var(--c-orange)}

/* ---------- เนื้อหาในเว็บ (prose blocks) ---------- */
.prose{margin-top:6px}
.prose .body{font-size:.96rem;color:var(--ink-soft);max-width:74ch;margin:0 0 14px}
.prose code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:var(--bg-alt);border-radius:5px;padding:1px 6px}
.cal{border-radius:12px;padding:15px 19px;font-size:.91rem;margin:16px 0;border:1px solid;line-height:1.6}
.cal.warn{background:var(--c-amber-t);border-color:var(--c-amber);color:#6E5310}
.cal.warn b{color:#4E3A08}
.cal.note{background:var(--bg-soft);border-color:var(--line);color:var(--ink-soft)}
.cal.note b{color:var(--ink)}
.cal.ok{background:var(--c-green-t);border-color:var(--c-green);color:#2F6B3A}

.tw{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin:14px 0}
table.tb{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
table.tb th,table.tb td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tbody tr:last-child td{border-bottom:0}
table.tb thead th{background:var(--bg-alt);font-size:.67rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;white-space:nowrap}
table.tb thead th.h-a{background:var(--c-blue-t);color:var(--c-blue)}
table.tb thead th.h-b{background:var(--c-orange-t);color:var(--c-orange)}
table.tb td.k{font-weight:600;color:var(--ink);background:var(--bg-soft);white-space:nowrap}
table.tb td small{display:block;color:var(--ink-mute);font-size:.83rem;margin-top:2px}

.stepgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:14px 0}
@media(max-width:1000px){.stepgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.stepgrid{grid-template-columns:1fr}}
.stepc{background:var(--card);border:1px solid var(--card-line);border-radius:13px;padding:15px 17px;box-shadow:var(--shadow)}
.stepc .sn{font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--ink-mute)}
.stepc .st{font-weight:700;font-size:.93rem;margin:4px 0 5px;line-height:1.35}
.stepc .sd{font-size:.85rem;color:var(--ink-soft);line-height:1.55}
.who{display:inline-block;font-size:.68rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:9px}
.who.a{background:var(--c-blue-t);color:var(--c-blue)}
.who.h{background:var(--c-orange-t);color:var(--c-orange)}

.blist{margin:12px 0;padding-left:1.2em;font-size:.93rem;color:var(--ink-soft);max-width:76ch}
.blist li{margin-bottom:9px}
.blist li::marker{color:var(--cta-ink)}

.fig{margin:16px 0;border:1px solid var(--card-line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.fig img{display:block;width:100%;height:auto;background:var(--bg-alt)}
.fig figcaption{padding:13px 18px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink-soft);background:var(--bg-soft)}
.fig figcaption b{color:var(--ink)}

.faq{border-top:1px solid var(--line);margin-top:12px}
.faq .qa{border-bottom:1px solid var(--line);padding:16px 0}
.faq .q{font-weight:700;font-size:.96rem;margin-bottom:5px}
.faq .a{font-size:.9rem;color:var(--ink-soft);max-width:78ch;line-height:1.62}

/* ---------- ตัวเรนเดอร์เนื้อหาในเว็บ (บล็อก) ---------- */
function blocks(list) {
  return (list || []).map(function (b) {
    switch (b.k) {
      case 'h':
        return '<h2 class="sec" style="margin-top:34px">' + b.t + '</h2>' +
               (b.d ? '<p class="sec-lede">' + b.d + '</p>' : '');
      case 'p':
        return '<p class="body">' + b.t + '</p>';
      case 'note':
      case 'warn':
      case 'ok':
        return '<div class="cal ' + b.k + '">' + b.t + '</div>';
      case 'table':
        return '<div class="tw"><table class="tb">' +
          (b.head ? '<thead><tr>' + b.head.map(function (h, i) {
            return '<th' + (b.hcls && b.hcls[i] ? ' class="' + b.hcls[i] + '"' : '') + '>' + h + '</th>';
          }).join('') + '</tr></thead>' : '') +
          '<tbody>' + b.rows.map(function (r) {
            return '<tr>' + r.map(function (c, i) {
              return '<td' + (i === 0 ? ' class="k"' : '') + '>' + c + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      case 'steps':
        return '<div class="stepgrid">' + b.items.map(function (s, i) {
          return '<div class="stepc"><div class="sn">ขั้น ' + (i + 1) + '</div>' +
            '<div class="st">' + s.t + '</div><div class="sd">' + s.d + '</div>' +
            (s.who ? '<span class="who ' + (s.who === 'AI' ? 'a' : 'h') + '">' + s.who + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      case 'list':
        return '<ul class="blist">' + b.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      case 'kv':
        return '<div class="kv2">' + b.items.map(function (x) {
          return '<div class="kv"><div class="kvl">' + x.l + '</div><div class="kvv">' + x.v + '</div></div>';
        }).join('') + '</div>';
      case 'stat':
        return '<div class="stats" style="margin-top:8px">' + b.items.map(function (x, i) {
          return '<div class="stat' + (i === 0 ? ' hero' : '') + '"><div class="lbl">' + x.l + '</div>' +
            '<div class="big">' + x.b + '</div><div class="sub">' + x.s + '</div></div>';
        }).join('') + '</div>';
      case 'img':
        return '<figure class="fig"><img src="' + b.src + '" alt="' + (b.alt || '') + '">' +
          (b.cap ? '<figcaption>' + b.cap + '</figcaption>' : '') + '</figure>';
      case 'faq':
        return '<div class="faq">' + b.items.map(function (x) {
          return '<div class="qa"><div class="q">' + x.q + '</div><div class="a">' + x.a + '</div></div>';
        }).join('') + '</div>';
      case 'link':
        return '<div class="cardgrid">' + b.items.map(function (x) {
          return topicCard({ icon: x.icon || 'doc', color: x.color, t: x.t, d: x.d, ext: x.to, up: x.up }, '');
        }).join('') + '</div>';
      default:
        return '';
    }
  }).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function ic(n) { return I[n] || I.doc; }
function route() { return (location.hash || '#/').replace(/^#\/?/, ''); }

/* ---------- sidebar ---------- */
function sidebar(active) {
  var items = DATA.nav.map(function (n) {
    if (n.sep) return '<div class="navsep">' + esc(n.sep) + '</div>';
    var on = (n.id === active);
    return '<button class="ni' + (on ? ' on' : '') + (n.off ? ' off' : '') + '"' +
      ' data-go="' + esc(n.id) + '"' + (n.off ? ' aria-disabled="true"' : '') + '>' +
      '<span class="ic">' + ic(n.icon) + '</span>' + esc(n.label) +
      (n.dot ? '<span class="dot" title="พักไว้ก่อน"></span>' : '') + '</button>';
  }).join('');
  return '<nav class="nav">' +
    '<button class="brand" data-go=""><span class="sq">◆</span>DesignOps</button>' +
    '<div class="navlist">' + items + '</div>' +
    '</nav>';
}

/* ---------- ชิ้นส่วน ---------- */
function head(s, crumb) {
  return (crumb || '') +
    '<div class="shead ' + (s.color || '') + '">' +
    '<div class="badge">' + ic(s.icon) + '</div>' +
    '<div><h1>' + esc(s.title) + '</h1><p class="tagline">' + esc(s.tag) + '</p></div></div>' +
    (s.lede ? '<p class="lede">' + esc(s.lede) + '</p>' : '');
}

function topicCard(t, secId) {
  var arw = t.goTool ? '→' : (t.ext ? '↗' : (t.id ? '→' : ''));
  var inner =
    '<span class="ico">' + ic(t.icon) + '</span>' +
    '<span class="t">' + esc(t.t) + '</span>' +
    '<span class="d">' + esc(t.d) + '</span>' +
    (t.up ? '<span class="up">' + esc(t.up) + '</span>' : '') +
    (arw ? '<span class="arw">' + arw + '</span>' : '') +
    (t.wait ? '<span class="badge2">' + esc(t.wait) + '</span>' : '');
  var cls = 'tc ' + (t.color || '');
  if (t.goTool) return '<button class="' + cls + '" data-go="tools/' + t.goTool + '">' + inner.replace('<span class="arw">↗</span>', '<span class="arw">→</span>') + '</button>';
  if (t.ext) return '<a class="' + cls + '" href="' + t.ext + '" target="_blank" rel="noopener">' + inner + '</a>';
  if (t.id) return '<button class="' + cls + '" data-go="' + secId + '/' + t.id + '">' + inner + '</button>';
  return '<div class="' + cls + ' off">' + inner + '</div>';
}


/* ---------- การ์ดเครื่องมือ (ย่อ) — กดเข้าหน้าเต็ม ---------- */
function toolCard(key) {
  var t = DATA.tool[key];
  if (!t) return '';
  return '<button class="tool" data-go="tools/' + key + '">' +
    '<div class="th"><span class="ti">' + ic('wrench') + '</span>' +
    '<div><div class="tt">' + esc(t.title) + '</div>' +
    '<code class="tcmd">/' + esc(t.cmd) + '</code></div>' +
    '<span class="tarw">→</span></div>' +
    '<div class="td">' + esc(t.lede) + '</div>' +
    '<div class="tm">' + t.modes.map(function (m) {
      return '<span class="tmode' + (m.wk === 'write' ? ' w' : '') + '">' + esc(m.m) + (m.wk === 'write' ? ' ✎' : '') + '</span>';
    }).join('') + '</div>' +
    '<div class="tsc">' + (t.modes.filter(function (m) { return m.wk === 'write'; }).length
      ? '✎ = โหมดที่เขียนของจริง · กดดูรายละเอียดก่อนใช้' : 'ไม่มีโหมดไหนเขียนของจริง') + '</div>' +
    '</button>';
}

function lockBox(l) {
  return '<div class="locknote"><div class="t">' + esc(l.t) + '</div><div class="d">' + esc(l.d) + '</div>' +
    '<ol>' + l.todo.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
}

/* ---------- Overview ---------- */

  });

      id: k, icon: s.icon, color: s.color, t: s.title, d: s.tag,
      up: ready + ' / ' + s.topics.length + ' พร้อมใช้'
    }, '');

  return '<div class="inner">' +
    head({ icon: 'home', title: 'DesignOps', tag: 'playbook · ของอ้างอิง · ทางเข้าต้นฉบับ', color: '',
           lede: 'ที่รวมทุกอย่างที่ DesignOps ต้องส่งต่อให้ทีม — วิธีทำงานแต่ละเรื่อง และของอ้างอิงว่าตัวจริงอยู่ที่ไหน' }) +
    '<div class="stats">' +
      '<div class="stat hero"><div class="lbl">รายการพร้อมใช้</div><div class="big">' + open + ' / ' + total + '</div><div class="sub">ที่เหลือกำลังเตรียม</div></div>' +
      '<div class="stat"><div class="lbl">หมวดใน Playbook</div><div class="big">' + secs.length + '</div><div class="sub">คู่กับ skill ที่ทีมใช้อยู่</div></div>' +
      '<div class="stat"><div class="lbl">สำเนาที่เว็บนี้เก็บเอง</div><div class="big">0</div><div class="sub">ลิงก์ออกทั้งหมด ไม่มีของเก่าค้าง</div></div>' +
      '<div class="stat"><div class="lbl">ปลายทาง</div><div class="big">4</div><div class="sub">Confluence · Figma · design-brain · Jira</div></div>' +
    '</div>' +
    '<div class="block"><h2 class="sec">Playbook</h2>' +
    '<p class="sec-lede">เลือกเรื่องที่กำลังจะทำ · ชื่อหมวดตรงกับชื่อ skill ที่พิมพ์ในเทอร์มินัล</p>' +
    '<div class="cardgrid">' + cards + '</div></div>' +
    '<div class="note"><b>ของที่ DesignOps เขียนเอง อยู่ในเว็บนี้ · ของที่มีเจ้าของอื่นดูแล ลิงก์ออกไปต้นฉบับ</b> — วิธีทำงานอ่านจบได้ที่นี่ ไม่ต้องกระโดดไปหลายที่ · ส่วนมาตรฐานกลางกับทะเบียนต่าง ๆ พาไปหาตัวจริง เพื่อไม่ให้เกิดสำเนาที่เก่าโดยไม่มีใครรู้ · การ์ด → = หน้าในเว็บนี้ · ↗ = ออกไปข้างนอก</div>' +

}

/* ---------- section ---------- */
function viewSec(id) {
  var s = DATA.sec[id];
  if (!s) return viewHome();
  var crumb = '<div class="crumb"><button data-go="">DesignOps</button><span class="sep">/</span><span>' + esc(s.title) + '</span></div>';
  var body = head(s, crumb) +
    (s.skill ? '<p class="sec-lede" style="margin-top:10px">เรียกด้วย <code>/' + esc(s.skill) + '</code> ใน Claude</p>' : '');
  if (s.lock) body += lockBox(s.lock);
  if (s.topics.length) {
    body += '<div class="block"><h2 class="sec">' + esc(s.docsHd || 'เรื่องในหมวดนี้') + '</h2>' +
      '<p class="sec-lede">' + esc(s.docsLede || 'การ์ดที่มี ↗ จะเปิดต้นฉบับข้างนอก · การ์ดที่มี → เป็นหน้าย่อยในเว็บนี้') + '</p>' +
      '<div class="cardgrid">' + s.topics.map(function (t) { return topicCard(t, id); }).join('') + '</div></div>';
  }
  if (s.tools && s.tools.length) {
    body += '<div class="block"><h2 class="sec">เครื่องมือ</h2>' +
      '<p class="sec-lede">ไม่ใช่เอกสาร — เป็นคำสั่งที่พิมพ์ใน Claude แล้วมันทำงานกับไฟล์จริงให้</p>' +
      '<div class="tools">' + s.tools.map(toolCard).join('') + '</div></div>';
  }
  return '<div class="inner">' + body + foot() + '</div>';
}

/* ---------- topic ---------- */
function viewTopic(secId, topId) {
  var t = DATA.topic[topId];
  if (!t) return viewSec(secId);
  var parent = DATA.sec[t.parent];
  var crumb = '<div class="crumb"><button data-go="">DesignOps</button><span class="sep">/</span>' +
    '<button data-go="' + t.parent + '">' + esc(parent.title) + '</button><span class="sep">/</span>' +
    '<span>' + esc(t.title) + '</span></div>';
  var body = head(t, crumb);

  if (t.start && t.start.length) {
    body += '<div class="block first"><h2 class="sec">คุณกำลังจะทำอะไร</h2>' +
      '<p class="sec-lede">เลือกข้อที่ตรงกับสถานการณ์ แล้วกดไปที่ต้นฉบับได้เลย</p>' +
      '<div class="entries">' + t.start.map(function (e) {
        return '<a class="entry" href="' + e.to + '" target="_blank" rel="noopener">' +
          '<div class="c">ถ้าคุณ</div><div class="q">' + esc(e.q) + '</div>' +
          '<div class="a">' + esc(e.a) + '</div><div class="go">' + esc(e.label) + ' ↗</div></a>';
      }).join('') + '</div></div>';
  }

  if (t.cards && t.cards.length) {
    body += '<div class="block' + (t.start ? '' : ' first') + '"><h2 class="sec">' + esc(t.cardsHd || 'เอกสาร') + '</h2>' +
      '<p class="sec-lede">' + esc(t.cardsLede || 'กดแล้วเปิดต้นฉบับ ไม่ใช่สำเนา') + '</p>' +
      '<div class="cardgrid">' + t.cards.map(function (c) { return topicCard(c, secId); }).join('') + '</div>' +
      (t.note && !t.records ? '<div class="note">⚠️ ' + t.note + '</div>' : '') + '</div>';
  }

  if (t.records && t.records.length) {
    body += '<div class="block"><h2 class="sec">License Record รายฟอนต์</h2>' +
      '<p class="sec-lede">1 ใบ = 1 license · สถานะในนี้ต้องตรงกับในทะเบียนกลาง</p>' +
      '<div class="items">' + t.records.map(function (r) {
        return '<a class="item" href="' + r.to + '" target="_blank" rel="noopener"><span class="arw">↗</span>' +
          '<div class="t">' + esc(r.t) + ' <span style="font-weight:400;font-size:.85rem">' + esc(r.st) + '</span></div>' +
          '<div class="w">' + esc(r.w) + '</div>' +
          '<div class="m"><span class="src">Confluence · UXUI Team</span><span>·</span><span>อัปเดต ' + esc(r.up) + '</span></div></a>';
      }).join('') + '</div>' +
      (t.note ? '<div class="note">⚠️ ' + t.note + '</div>' : '') + '</div>';
  }

  if (t.blocks) body += '<div class="prose">' + blocks(t.blocks) + '</div>';

  if (t.legend && t.legend.length) {
    body += '<div class="block"><h2 class="sec">สถานะหมายความว่าอะไร</h2>' +
      '<p class="sec-lede">คำชุดเดียวกันนี้ใช้ทั้งในทะเบียนกลางและในใบรายฟอนต์</p>' +
      '<div class="legend">' + t.legend.map(function (l) {
        return '<div class="lg"><div class="s">' + esc(l.s) + '</div><div class="x">' + esc(l.x) + '</div></div>';
      }).join('') + '</div></div>';
  }

  return '<div class="inner">' + body + foot() + '</div>';
}

  var keys = Object.keys(DATA.tool);
  var chain = DATA.toolChain.map(function (c, i) {
    return (i ? '<div class="arrow">→</div>' : '') +
      '<div class="cstep"><code>/' + esc(c.cmd) + '</code><div class="cm">' + esc(c.mode) + '</div>' +
      '<div class="cn">' + esc(c.n) + '</div></div>';
  }).join('');
  var cards = keys.map(function (k) {
    var t = DATA.tool[k];
    var writes = t.modes.filter(function (m) { return m.wk === 'write'; }).length;
    return topicCard({
      id: k, icon: t.icon, color: t.color, t: '/' + t.cmd, d: t.title + ' — ' + t.tag,

      wait: t.proof.ok ? null : 'ยังไม่เคยรัน'

  }).join('');

  return '<div class="inner">' +
    head({ icon: 'wrench', title: 'เครื่องมือ', tag: 'คำสั่งที่พิมพ์ใน Claude', color: '',
           lede: 'ไม่ใช่เอกสาร — เป็นคำสั่งที่พิมพ์แล้วมันทำงานกับไฟล์จริงให้ · ทุกตัวบอกไว้ว่าโหมดไหนเขียนของจริง โหมดไหนแค่บอกในแชท' }) +
    '<div class="block first"><h2 class="sec">ใช้ตัวไหนตอนไหน</h2>' +
      '<p class="sec-lede">ลำดับปกติของงาน 1 ชิ้น — จากทำไฟล์เสร็จ ถึงตรวจหลัง dev ทำ</p>' +
      '<div class="chain">' + chain + '</div></div>' +
    '<div class="block"><h2 class="sec">เครื่องมือทั้งหมด</h2>' +
      '<p class="sec-lede">กดเข้าไปดูว่าต้องเตรียมอะไร มันแตะอะไร และมีกฎกันพลาดอะไรบ้าง</p>' +
      '<div class="cardgrid">' + cards + '</div></div>' +
    foot() + '</div>';
}

/* ---------- หน้าเครื่องมือรายตัว ---------- */
function viewTool(key) {
  var t = DATA.tool[key];
  if (!t) return viewTools();
  var crumb = '<div class="crumb"><button data-go="">DesignOps</button><span class="sep">/</span>' +
    '<button data-go="tools">เครื่องมือ</button><span class="sep">/</span><span>/' + esc(t.cmd) + '</span></div>';

  var WK = { read: ['อ่านอย่างเดียว', 'read'], write: ['เขียนของจริง', 'write'], safe: ['ไม่แตะของจริง', 'safe'] };
  var modes = t.modes.map(function (m) {
    var w = WK[m.wk] || WK.safe;
    return '<div class="mrow ' + w[1] + '">' +
      '<div class="mn">' + esc(m.m) + (m.dflt ? '<span class="dflt">ค่าเริ่มต้น</span>' : '') + '</div>' +
      '<div class="md">' + esc(m.d) + '</div>' +
      '<div class="mw"><span class="wtag ' + w[1] + '">' + esc(w[0]) + '</span><span class="wx">' + esc(m.w) + '</span></div>' +
      '</div>';
  }).join('');

  var prep = t.prep.map(function (p, i) {
    return '<div class="prow"><div class="pn">' + (i + 1) + '</div>' +
      '<div><div class="pt">' + esc(p.t) + '</div><div class="pw">' + esc(p.w) + '</div></div></div>';
  }).join('');

  var rules = t.rules.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');

  return '<div class="inner">' +
    crumb +
    '<div class="shead ' + (t.color || '') + '"><div class="badge">' + ic(t.icon) + '</div>' +
    '<div><h1>/' + esc(t.cmd) + '</h1><p class="tagline">' + esc(t.title) + ' · ' + esc(t.tag) + '</p></div></div>' +
    '<p class="lede">' + esc(t.lede) + '</p>' +

    '<div class="kv2">' +
      '<div class="kv"><div class="kvl">ใช้เมื่อไหร่</div><div class="kvv">' + esc(t.when) + '</div></div>' +
      '<div class="kv"><div class="kvl">เริ่มยังไง</div><div class="kvv">' + esc(t.type) + '</div></div>' +
    '</div>' +

    '<div class="proof ' + (t.proof.ok ? 'ok' : 'no') + '">' +
      '<div class="pl">' + (t.proof.ok ? '✅ ' : '⬜ ') + esc(t.proof.t) + '</div>' +
      '<div class="pd">' + esc(t.proof.d) + '</div></div>' +

    '<div class="block"><h2 class="sec">โหมด และมันแตะอะไร</h2>' +
      '<p class="sec-lede">ดูคอลัมน์ขวาก่อนใช้ — โหมดที่เขียนของจริงย้อนคืนยากกว่าโหมดที่แค่รายงาน</p>' +
      '<div class="modes">' + modes + '</div></div>' +

    '<div class="block"><h2 class="sec">ต้องเตรียมอะไร</h2>' +
      '<p class="sec-lede">ระบบจะเช็คเองก่อนว่าอะไรพร้อมแล้ว แล้วขอเฉพาะที่ขาด — ไม่พ่นรายการยาวให้ไล่หาเอง</p>' +
      '<div class="preps">' + prep + '</div></div>' +

    '<div class="block"><h2 class="sec">กฎกันพลาด</h2>' +
      '<p class="sec-lede">ระบบบังคับตัวเองตามนี้ ไม่ใช่ขอความร่วมมือ</p>' +
      '<ul class="rules">' + rules + '</ul>' +
      (t.notdo ? '<div class="note" style="margin-top:16px"><b>สิ่งที่มันจะไม่ทำ</b> — ' + esc(t.notdo) + '</div>' : '') +
    '</div>' +
    foot() + '</div>';
}

function foot() {
  return '<footer>DesignOps · SkillLane UX/UI — ปรับปรุง ' + esc(DATA.updated) +
    ' · <a href="' + DATA.roadmap + '" target="_blank" rel="noopener">Roadmap 2026 ↗</a>' +
    ' · เจอลิงก์เสียหรือของที่เก่าไปแล้ว ทักได้เลย จะได้แก้ที่ต้นทาง</footer>';
}

function render() {
  var r = route(), parts = r.split('/').filter(Boolean);
  var active = parts[0] || '', main;
  if (parts[0] === 'tools') main = parts[1] ? viewTool(parts[1]) : viewTools();
  else if (parts.length >= 2) main = viewTopic(parts[0], parts[1]);
  else if (parts.length === 1) main = viewSec(parts[0]);
  else main = viewHome();
  document.body.innerHTML = '<div class="shell">' + sidebar(active) + '<div class="main">' + main + '</div></div>';
  window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (!b || b.getAttribute('aria-disabled') === 'true') return;
  e.preventDefault();
  location.hash = '/' + b.getAttribute('data-go');
});
window.addEventListener('hashchange', render);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();

</script>
