<title>DesignOps</title>
<style>
/*@FONTS@*/
*{box-sizing:border-box}html,body{margin:0;padding:0}
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FFFFFF;--bg-alt:#F7F7F6;--bg-soft:#FBFAF9;
  --ink:#1B1A18;--ink-soft:#4B4744;--ink-mute:#8C8884;
  --line:#EBE8E5;--card:#FFFFFF;--card-line:#EBE8E5;
  --cta:#00E1FF;--cta-ink:#0A7C93;--cta-deep:#075A6C;--cta-tint:#DFF8FE;
  --c-blue:#3D7BC2;--c-blue-t:#EAF2FB;
  --c-green:#4F9E5C;--c-green-t:#EAF5EC;
  --c-orange:#DF6B3C;--c-orange-t:#FCEEE7;
  --c-purple:#7C5CBF;--c-purple-t:#F0EBFA;
  --c-amber:#D89B2A;--c-amber-t:#FBF2DE;
  --radius:16px;
  --shadow:0 1px 2px rgba(27,26,24,.04),0 12px 28px -22px rgba(27,26,24,.22);
  --ff:"IBM Plex Sans Thai","IBM Plex Sans","Sukhumvit Set","Segoe UI",system-ui,sans-serif;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:11px clamp(18px,4vw,60px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.92rem;background:none;border:0;color:inherit;padding:0;cursor:pointer}
.brand .sq{width:29px;height:29px;border-radius:9px;background:var(--ink);color:var(--cta);display:grid;place-items:center;font-size:.8rem}
.crumbs{display:flex;align-items:center;gap:7px;font-size:.87rem;color:var(--ink-mute);flex-wrap:wrap;min-width:0}
.crumbs button{color:var(--cta-ink);font-weight:600;cursor:pointer;background:none;border:0;padding:0}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{opacity:.45}
.crumbs .cur{color:var(--ink);font-weight:600}
.up{margin-left:auto;border:1px solid var(--line);background:var(--bg-alt);color:var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:.83rem;font-weight:600;cursor:pointer;text-decoration:none}
.up:hover{background:var(--card);color:var(--ink)}
.up:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cta-ink);outline-offset:2px}

.band{max-width:1180px;margin:0 auto;padding:44px clamp(18px,4vw,60px)}
.band.tight{padding-top:26px}
.band+.band{border-top:1px solid var(--line)}
.kicker{font-size:.71rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:11px}
h1{font-weight:700;font-size:clamp(2rem,4.4vw,2.9rem);line-height:1.04;letter-spacing:-.025em;margin:0 0 .3em;text-wrap:balance}
h1 .yr{color:var(--cta-ink)}
.lede{font-size:1.04rem;color:var(--ink-soft);max-width:680px;margin:0}
h2.sec{font-weight:700;font-size:clamp(1.35rem,2.3vw,1.75rem);letter-spacing:-.02em;margin:0 0 .3em}
.sec-lede{color:var(--ink-soft);max-width:700px;margin:0 0 22px;font-size:.95rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:28px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat.hero{border-top:3px solid var(--cta)}
.stat .lbl{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700}
.stat .big{font-weight:700;font-size:1.85rem;line-height:1.12;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.hero .big{color:var(--cta-ink)}
.stat .sub{font-size:.81rem;color:var(--ink-mute)}

/* lanes */
.lanes{display:flex;flex-direction:column;gap:14px}
.lane{background:var(--card);border:1px solid var(--card-line);border-left:4px solid var(--ink-mute);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.lane.blue{border-left-color:var(--c-blue)}.lane.green{border-left-color:var(--c-green)}
.lane.purple{border-left-color:var(--c-purple)}.lane.orange{border-left-color:var(--c-orange)}
.lane.off{background:var(--bg-soft)}
.lane-head{display:grid;grid-template-columns:1fr 132px 116px;gap:16px;align-items:center;padding:16px 20px 11px}
@media(max-width:760px){.lane-head{grid-template-columns:1fr}}
.lane-head .nm{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lane-head .goal{font-size:.87rem;color:var(--ink-soft);margin-top:3px}
.skill{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;color:var(--ink-mute);background:var(--bg-alt);border-radius:6px;padding:2px 7px;font-weight:400}
.krs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.krchip{font-size:.63rem;font-weight:700;letter-spacing:.05em;border-radius:999px;padding:3px 9px;background:var(--bg-alt);color:var(--ink-mute)}
.blue .krchip{background:var(--c-blue-t);color:var(--c-blue)}.green .krchip{background:var(--c-green-t);color:var(--c-green)}
.purple .krchip{background:var(--c-purple-t);color:var(--c-purple)}.orange .krchip{background:var(--c-orange-t);color:var(--c-orange)}
.lane-pct{text-align:right}
@media(max-width:760px){.lane-pct{text-align:left}}
.lane-pct .b{font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.lane-pct .b.on{color:var(--cta-ink)}
.lane-pct .l{font-size:.71rem;color:var(--ink-mute)}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:.83rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--bg-alt);color:var(--ink-mute);border:1px solid var(--line);cursor:default}
.flow{display:flex;align-items:stretch;padding:2px 20px 16px;overflow-x:auto}
.fstep{flex:1 1 0;min-width:150px;background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:left;position:relative}
.fstep .c{font-size:.63rem;font-weight:700;letter-spacing:.09em;color:var(--ink-mute)}
.fstep .t{font-size:.87rem;font-weight:600;margin:3px 0 5px;line-height:1.3}
.fstep .n{font-size:.73rem;color:var(--ink-mute)}
.fstep.empty{border-color:var(--c-orange);background:var(--c-orange-t)}
.fstep.empty .n{color:var(--c-orange);font-weight:600}
.arrow{flex:0 0 20px;display:grid;place-items:center;color:var(--line)}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:0 20px 15px;font-size:.79rem;color:var(--ink-mute)}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i.e{width:14px;height:10px;border-radius:3px;background:var(--c-orange-t);border:1px solid var(--c-orange)}

/* detail header */
.thead{background:var(--card);border:1px solid var(--card-line);border-top:3px solid var(--c-purple);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;display:grid;grid-template-columns:1fr 250px;gap:26px;align-items:center}
@media(max-width:820px){.thead{grid-template-columns:1fr}}
.thead h2{margin:0 0 6px;font-size:1.3rem;font-weight:700;letter-spacing:-.015em}
.thead .goal{font-size:.96rem;color:var(--ink-soft);margin:0;max-width:600px}
.bigprog{text-align:right}
@media(max-width:820px){.bigprog{text-align:left}}
.bigprog .n{font-weight:700;font-size:2.4rem;line-height:1;color:var(--cta-ink);font-variant-numeric:tabular-nums}
.bigprog .cap{font-size:.79rem;color:var(--ink-mute);margin-top:3px}

/* entry strip (คุณกำลังจะทำอะไร) */
.entries{display:flex;align-items:stretch;overflow-x:auto;margin-top:4px}
.entry{flex:1 1 0;min-width:210px;background:var(--c-purple-t);border:1px solid var(--c-purple);border-radius:12px;padding:15px 17px;text-decoration:none;color:inherit;display:block}
.entry:hover{background:#E7DFF7}
.entry .c{font-size:.63rem;font-weight:700;letter-spacing:.09em;color:var(--c-purple)}
.entry .q{font-weight:700;font-size:.95rem;margin:3px 0 5px;color:#3F2C73}
.entry .a{font-size:.85rem;color:#5B4795}
.entry .go{font-size:.8rem;font-weight:700;color:#3F2C73;margin-top:8px}

/* item cards */
.group{margin-top:24px}
.ghd{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--card-line);border-radius:13px;box-shadow:var(--shadow);padding:16px 18px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{border-color:var(--c-purple)}
.card .t{font-weight:700;font-size:.95rem;letter-spacing:-.01em;line-height:1.35}
.card .w{font-size:.85rem;color:var(--ink-soft);flex:1}
.card .m{font-size:.74rem;color:var(--ink-mute);display:flex;gap:7px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.card .m .src{font-weight:600;color:var(--ink-soft)}

.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:4px}
@media(max-width:800px){.legend{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.legend{grid-template-columns:1fr}}
.lg{background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.lg .s{font-weight:700;font-size:.89rem;margin-bottom:3px}
.lg .x{font-size:.81rem;color:var(--ink-soft)}

.note{background:var(--c-amber-t);border:1px solid var(--c-amber);border-radius:12px;padding:15px 19px;font-size:.9rem;color:#6E5310;margin-top:20px}
.note b{color:#4E3A08}
.locknote{background:var(--card);border:1px solid var(--card-line);border-left:4px solid var(--c-amber);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.locknote .t{font-weight:700;margin-bottom:7px}
.locknote .d{font-size:.93rem;color:var(--ink-soft);max-width:70ch}
.locknote ol{margin:11px 0 0;padding-left:1.2em;font-size:.9rem;color:var(--ink-soft)}
.locknote li{margin-bottom:4px}
footer{max-width:1180px;margin:0 auto;padding:26px clamp(18px,4vw,60px) 46px;font-size:.82rem;color:var(--ink-mute);border-top:1px solid var(--line)}
</style>
